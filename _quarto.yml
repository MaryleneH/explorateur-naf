project:
  type: website
  output-dir: _site
  # Les CSV sont chargés en fetch() côté navigateur : Quarto ne peut pas les
  # détecter dans le HTML, il faut donc les déclarer explicitement en ressources.
  resources:
    - data/*.csv
    # Référentiels des études (manifeste de provenance, contexte daté,
    # passerelle produits) : publiés pour la traçabilité.
    - data/etudes/*.csv
    # Contenu des parcours guidés, chargé par assets/js/naf-parcours.js.
    - data/parcours.json
    # Dernier état de contrôle des sources (page « État des sources »).
    - data/quality/*.json
    # Règles méthodologiques de l'Atelier d'étude.
    - data/atelier_scenarios.json
    # Cas pratique BODACC (Programmes & cas pratiques) : les trois annonces
    # réelles, leurs réponses API archivées, la traçabilité et les sorties
    # du programme — chargées en fetch() par assets/js/naf-bodacc.js.
    - data/exemples/bodacc/raw/*.json
    - data/exemples/bodacc/reponses_api/*.json
    - data/exemples/bodacc/processed/*.csv
    - data/exemples/bodacc/provenance.csv
    # La police d'annotation est référencée depuis fonts.css : Quarto ne suit
    # pas les url() des feuilles de style, il faut la déclarer explicitement.
    - assets/fonts/*.woff2

website:
  title: "Explorateur NAF"
  site-url: "https://maryleneh.github.io/explorateur-naf"
  favicon: assets/favicon.svg
  navbar:
    # Le logo porte l'identité ; le libellé décrit l'objet du site.
    title: "NAF 2008–2025"
    logo: assets/img/logo-naf.svg
    logo-alt: "Explorateur NAF — retour à l'accueil"
    # Architecture de navigation : la navbar raconte la progression
    # EXPLORER → COMPRENDRE → CADRER → AGIR → APPROFONDIR → VÉRIFIER,
    # sans en faire un tunnel. Les pages historiques de bonus/ gardent
    # leur chemin physique (deep links préservés) : seule la navigation
    # visible les reclasse.
    left:
      - text: Explorer
        menu:
          - href: explorer/index.qmd
            text: Naviguer dans la NAF
          - href: explorer/visualisation.qmd
            text: Voyage visuel
          - href: bonus/parcours.qmd
            text: Parcours guidés
      - text: NAF 2008 ↔ 2025
        menu:
          - href: comparer/index.qmd
            text: Explorer les changements
          - href: comparer/flux.qmd
            text: Voyage 2008 → 2025
      - href: defense/index.qmd
        text: NAF & Défense
      - text: Comprendre
        menu:
          - href: comprendre/index.qmd
            text: Comprendre la NAF
          - href: bonus/atelier.qmd
            text: Atelier d'étude
          - href: comprendre/sources/index.qmd
            text: Comprendre les sources
      - text: Boîte à outils
        menu:
          - href: comprendre/boite-outils.qmd
            text: Démarrage & recettes
          - href: comprendre/programmes/index.qmd
            text: Programmes & cas pratiques
          - href: comprendre/programmes/bodacc-json.qmd
            text: JSON BODACC · cas complet
          - href: bonus/sources.qmd
            text: État des sources
      - href: methode/index.qmd
        text: Méthode & provenance
    right:
      - search
  # Footer global : auteur, transparence (code source), amélioration continue
  # (issues). Remplacer LINKEDIN_URL_A_REMPLACER par l'URL du profil LinkedIn :
  # tant que le placeholder est en place, le nom s'affiche sans lien (voir
  # includes/scripts.html), jamais comme un lien cassé.
  page-footer:
    left: >-
      Conçu par <a class="naf-footer-author" href="LINKEDIN_URL_A_REMPLACER"
      target="_blank" rel="noopener noreferrer"><i class="bi bi-linkedin"
      aria-hidden="true"></i> Marylène Henry</a>
    center: >-
      <a class="naf-footer-link"
      href="https://github.com/MaryleneH/explorateur-naf" target="_blank"
      rel="noopener noreferrer" title="Voir le dépôt GitHub"><i
      class="bi bi-github" aria-hidden="true"></i> Code source</a>
      <span class="naf-footer-sep" aria-hidden="true">·</span>
      <a class="naf-footer-link"
      href="https://github.com/MaryleneH/explorateur-naf/issues/new?template=site-feedback.yml"
      target="_blank" rel="noopener noreferrer"
      title="Signaler un problème sur GitHub"><i class="bi bi-chat-right-dots"
      aria-hidden="true"></i> Signaler un problème</a>
    right: "Données : Insee (NAF rév.2 et NAF 2025)"

format:
  html:
    theme:
      - cosmo
      - assets/css/theme.scss
    css: assets/css/fonts.css
    toc: false
    smooth-scroll: true
    include-in-header:
      - includes/scripts.html

execute:
  echo: false
  warning: false
  message: false
