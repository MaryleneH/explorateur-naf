project:
  type: website
  output-dir: _site
  # Les CSV sont chargés en fetch() côté navigateur : Quarto ne peut pas les
  # détecter dans le HTML, il faut donc les déclarer explicitement en ressources.
  resources:
    - data/*.csv
    # La police d'annotation est référencée depuis fonts.css : Quarto ne suit
    # pas les url() des feuilles de style, il faut la déclarer explicitement.
    - assets/fonts/*.woff2

website:
  title: "Explorateur NAF"
  site-url: "https://maryleneh.github.io/explorateur-naf"
  favicon: assets/favicon.svg
  navbar:
    left:
      - text: Explorer
        menu:
          - href: explorer/index.qmd
            text: Naviguer dans la NAF
          - href: explorer/visualisation.qmd
            text: Voyage visuel
      - href: comparer/index.qmd
        text: Comparer 2008 ↔ 2025
      - href: defense/index.qmd
        text: NAF & Défense
      - href: comprendre/index.qmd
        text: Comprendre
      - href: methode/index.qmd
        text: Méthode & sources
    right:
      - search
  page-footer:
    left: "Explorateur NAF"
    right: "Données : Insee (NAF rév.2 et NAF 2025)"

format:
  html:
    theme:
      - cosmo
      - assets/css/theme.scss
    css: assets/css/fonts.css
    toc: false
    smooth-scroll: true
    include-in-header:
      - includes/scripts.html

execute:
  echo: false
  warning: false
  message: false
